<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 192 192">
  <!-- Gradients -->
  <defs>
    <!-- Ultra-vibrant orange-to-red gradient for premium look -->
    <linearGradient id="logoOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#FF3B30" />
    </linearGradient>
    <!-- Background rich dark carbon radial gradient -->
    <radialGradient id="rimGlow" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1E1E20" />
      <stop offset="100%" stop-color="#080808" />
    </radialGradient>
  </defs>

  <!-- Solid rounded App Box Background -->
  <rect x="2" y="2" width="188" height="188" rx="46" fill="url(#rimGlow)" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Antennas of the TV set -->
  <g>
    <!-- Left Antenna -->
    <line x1="96" y1="64" x2="62" y2="30" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <circle cx="62" cy="30" r="7" fill="#FFFFFF"/>
    
    <!-- Right Antenna -->
    <line x1="96" y1="64" x2="130" y2="30" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <circle cx="130" cy="30" r="7" fill="#FFFFFF"/>
  </g>

  <!-- TV Outer Frame, beautifully rounded with responsive corners -->
  <rect x="30" y="62" width="132" height="96" rx="22" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linejoin="round"/>

  <!-- Left Side: Dynamic Play Sign & Broadcast Waves -->
  <g transform="translate(4, -3)">
    <!-- Rounded triangle Play button -->
    <path d="M44,101.5 C44,99.5 46.2,98.2 48.0,99.2 C53.3,102.2 58.7,105.2 64.0,108.2 C65.8,109.2 65.8,111.8 64.0,112.8 C58.7,115.8 53.3,118.8 48.0,121.8 C46.2,122.8 44,121.5 44,119.5 Z" fill="url(#logoOrange)"/>
    
    <!-- First Broadcast Wave -->
    <path d="M72,100 A15,15 0 0,1 72,122" fill="none" stroke="url(#logoOrange)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Second Broadcast Wave -->
    <path d="M78,94 A23,23 0 0,1 78,128" fill="none" stroke="url(#logoOrange)" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- Right Side: Bold Texts "FLUX" & "TV" -->
  <text x="91" y="99" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="23" letter-spacing="-0.5" text-anchor="start">FLUX</text>
  <text x="91" y="128" fill="url(#logoOrange)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="33" letter-spacing="-0.5" text-anchor="start">TV</text>

  <!-- Bottom: Centered "PRO" overlapping Pill Capsule -->
  <g>
    <!-- Solid dark backdrop to clip the white frame underneath -->
    <rect x="65" y="142" width="62" height="23" rx="8" fill="#080808"/>
    <!-- The Orange Capsule -->
    <rect x="67" y="144" width="58" height="19" rx="6" fill="url(#logoOrange)"/>
    <!-- Text PRO -->
    <text x="96" y="157.5" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="11" letter-spacing="1.5" text-anchor="middle" dominant-baseline="central">PRO</text>
  </g>
</svg>
