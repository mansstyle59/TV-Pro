name: Build Android TV App

# Déclenche le workflow sur chaque push ou pull request vers la branche principale
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
    # Étape 1 : Vérifier le code source du dépôt
    - name: Checkout code
      uses: actions/checkout@v3

    # Étape 2 : Définir le cache pour Gradle (accélère la construction)
    - name: Set up Gradle cache
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # Étape 3 : Configurer le SDK Android
    - name: Set up Java (JDK 17)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK
      uses: android-actions/setup-android@v2
      with:
        api-level: 30
        build-tools: 30.0.3

    # Étape 4 : Construire l'application Android
    - name: Build Android TV APK
      run: ./gradlew assembleRelease

    # Étape 5 : Ajouter les APK générées aux artefacts (optionnel)
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-tv-apk
        path: app/build/outputs/apk/release/*.apk
